services:
  api:
    build:
      context: .
      dockerfile: packages/dkrypt/Dockerfile
      args:
        BUILD_REF: ${BUILD_REF:-development}
    image: ${DKRYPT_IMAGE:-dkrypt:latest}
    container_name: dkrypt
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      PORT: 8080
      BIND_HOST: 127.0.0.1
    volumes:
      - appstore-config:/root/.ipadecrypt
      - ipa-storage:/data/artifacts
      - state:/data/state
      - ${HOME}/.ssh/id_ed25519_ipad:/root/.ssh/id_ed25519:ro

volumes:
  appstore-config:
    name: dkrypt_appstore-config
  ipa-storage:
    name: dkrypt_ipa-tmp
  state:
    name: dkrypt_state
