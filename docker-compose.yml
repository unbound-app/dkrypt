services:
  api:
    build:
      context: .
      dockerfile: packages/dkrypt/Dockerfile
      args:
        BUILD_REF: ${BUILD_REF:-development}
    image: ${DKRYPT_IMAGE:-dkrypt:latest}
    container_name: dkrypt
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    network_mode: host
    env_file:
      - .env
    environment:
      PORT: 8080
      BIND_HOST: 127.0.0.1
      DEVICE_BRIDGE_SOCKET: /run/dkrypt/device-bridge.sock
      DEVICE_MUX_SOCKET: /run/dkrypt/usbmuxd.sock
      DEVICE_PAIRING_STORE: /data/state/device-pairing
      NETMUXD_BIN: /usr/local/bin/netmuxd
      DEVICE_SSH_KEY_PATH: /run/dkrypt/device_ssh_key
      DEVICE_SSH_KEY_SOURCE: /device-ssh-key-source
    volumes:
      - ipa-storage:/data/artifacts
      - state:/data/state
      - ${DEVICE_SSH_KEY_HOST_PATH:-${HOME}/.ssh/id_ed25519}:/device-ssh-key-source:ro
    devices:
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run/dkrypt:mode=0710,size=16m
      - /data/tmp:mode=1770,uid=10001,gid=10001,size=1g
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
          pids: 512

volumes:
  ipa-storage:
    name: dkrypt_ipa-tmp
  state:
    name: dkrypt_state
