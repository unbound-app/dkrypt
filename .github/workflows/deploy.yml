name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: |
          cd packages/dkrypt && bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile
      - name: Run Moon checks
        run: bunx @moonrepo/cli@2.4.6 run dkrypt:check

  image:
    name: Build immutable image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Generate changelog asset
        run: |
          cd packages/dkrypt/web
          bun install --frozen-lockfile
          bun run scripts/generate-changelog.ts
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: packages/dkrypt/Dockerfile
          push: true
          build-args: BUILD_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main

  deploy:
    name: Deploy to homelab
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    steps:
      - name: Update deployment configuration
        run: |
          set -e
          git config --global --add safe.directory /home/adrian/dkrypt
          cd /home/adrian/dkrypt
          git fetch origin main
          git merge --ff-only origin/main
      - name: Pull and deploy immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: |
          set -e
          cd /home/adrian/dkrypt
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker container inspect dkrypt >/dev/null 2>&1; then
            docker tag "$(docker inspect --format '{{.Image}}' dkrypt)" dkrypt:previous
          elif docker image inspect dkrypt:latest >/dev/null 2>&1; then
            docker tag dkrypt:latest dkrypt:previous
          fi
          docker pull "$IMAGE"
          docker tag "$IMAGE" dkrypt:latest
          DKRYPT_IMAGE="$IMAGE" docker compose up -d --no-build api

      - name: Wait for health, roll back on failure
        run: |
          set -e
          for i in $(seq 1 15); do
            page=$(curl -sf http://127.0.0.1:8080/ || true)
            asset=$(printf '%s' "$page" | grep -oE '/assets/[^" ]+\.js' | head -n 1)
            if [ -n "$asset" ] && curl -sf -o /dev/null "http://127.0.0.1:8080$asset"; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done

          echo "service did not become healthy in time" >&2
          docker compose -f /home/adrian/dkrypt/docker-compose.yml logs --tail 50 api

          if docker image inspect dkrypt:previous >/dev/null 2>&1; then
            echo "rolling back to the previous image" >&2
            DKRYPT_IMAGE=dkrypt:previous docker compose -f /home/adrian/dkrypt/docker-compose.yml up -d --no-build api
          else
            echo "no previous image to roll back to" >&2
          fi
          exit 1
