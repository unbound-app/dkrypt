name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  ci:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        run: |
          cd packages/dkrypt && bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile
      - name: Run Moon checks
        run: bunx @moonrepo/cli@2.4.6 run dkrypt:check
      - name: Run isolated service load scenarios
        run: |
          cd packages/dkrypt
          bun run load-test
      - name: Verify generated API clients
        run: |
          cd packages/dkrypt
          bun run clients:generate
          python -m py_compile clients/python/dkrypt_client.py
          git diff --exit-code -- clients
      - name: Validate container supervisor
        run: sh -n packages/dkrypt/entrypoint.sh
      - name: Test Rust device bridge
        run: |
          cd packages/device-bridge
          cargo test --locked
          cargo check --locked
      - name: Install Chromium for browser checks
        run: |
          cd packages/dkrypt/web
          bunx playwright install --with-deps chromium
      - name: Run browser checks
        run: |
          cd packages/dkrypt/web
          bun run e2e

  image:
    name: Build immutable image
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Generate changelog asset
        run: |
          cd packages/dkrypt/web
          bun install --frozen-lockfile
          bun run scripts/generate-changelog.ts
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: packages/dkrypt/Dockerfile
          push: true
          build-args: BUILD_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.20.10
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          output-file: dkrypt-sbom.spdx.json
          format: spdx-json
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dkrypt-sbom-${{ github.sha }}
          path: dkrypt-sbom.spdx.json
          if-no-files-found: error
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
      - name: Sign image and attest SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --predicate dkrypt-sbom.spdx.json --type https://spdx.dev/Document "$IMAGE"

  deploy:
    name: Deploy to homelab
    needs: image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    steps:
      - name: Write runtime stack manifest
        run: |
          set -e
          RUNTIME_DIR=/home/adrian/.local/share/dkrypt
          RUNTIME_HOME=$(cd "$RUNTIME_DIR/../../.." && pwd)
          test -f "$RUNTIME_DIR/.env"
          if docker container inspect dkrypt >/dev/null 2>&1; then
            existing_key_path=$(docker inspect --format '{{range .Mounts}}{{if or (eq .Destination "/device-ssh-key-source") (eq .Destination "/run/dkrypt/host-ssh-key") (eq .Destination "/root/.ssh/id_ed25519")}}{{.Source}}{{end}}{{end}}' dkrypt 2>/dev/null || true)
            if [ -n "$existing_key_path" ]; then
              DEVICE_SSH_KEY_HOST_PATH="$existing_key_path"
            fi
          fi
          if [ -z "${DEVICE_SSH_KEY_HOST_PATH:-}" ]; then
            for candidate in "$RUNTIME_HOME"/.ssh/id_* "$HOME"/.ssh/id_*; do
              case "$candidate" in
                *.pub|*.cert|*.crt) continue ;;
              esac
              if [ -f "$candidate" ] && [ -r "$candidate" ]; then
                DEVICE_SSH_KEY_HOST_PATH="$candidate"
                break
              fi
            done
          fi
          if [ -z "${DEVICE_SSH_KEY_HOST_PATH:-}" ]; then
            echo "No SSH key source configured for the dkrypt compatibility channel" >&2
            echo "Checked $RUNTIME_HOME/.ssh and ${HOME:-unknown}/.ssh" >&2
            find "$RUNTIME_HOME/.ssh" "$HOME/.ssh" -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          printf 'DEVICE_SSH_KEY_HOST_PATH=%s\n' "$DEVICE_SSH_KEY_HOST_PATH" >> "$GITHUB_ENV"
          cat > "$RUNTIME_DIR/compose.yml" <<'EOF'
          name: dkrypt
          services:
            api:
              image: ${DKRYPT_IMAGE:?DKRYPT_IMAGE is required}
              container_name: dkrypt
              restart: unless-stopped
              init: true
              stop_grace_period: 30s
              security_opt:
                - no-new-privileges:true
              network_mode: host
              env_file:
                - .env
              environment:
                PORT: 8080
                BIND_HOST: 127.0.0.1
                SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:?SESSION_SIGNING_SECRET is required}
                DEVICE_BRIDGE_SOCKET: /run/dkrypt/device-bridge.sock
                DEVICE_MUX_SOCKET: /run/dkrypt/usbmuxd.sock
                DEVICE_PAIRING_STORE: /data/state/device-pairing
                NETMUXD_BIN: /usr/local/bin/netmuxd
                DEVICE_SSH_KEY_PATH: /run/dkrypt/device_ssh_key
                DEVICE_SSH_KEY_SOURCE: /device-ssh-key-source
              volumes:
                - ipa-storage:/data/artifacts
                - state:/data/state
                - ${DEVICE_SSH_KEY_HOST_PATH:?DEVICE_SSH_KEY_HOST_PATH is required}:/device-ssh-key-source:ro
                - /dev/bus/usb:/dev/bus/usb
              device_cgroup_rules:
                - 'c 189:* rwm'
              tmpfs:
                - /run/dkrypt:mode=0710,size=16m
                - /data/tmp:mode=1770,uid=10001,gid=10001,size=1g
              deploy:
                resources:
                  limits:
                    cpus: '4.0'
                    memory: 4G
                    pids: 512
          volumes:
            ipa-storage:
              external: true
              name: dkrypt_ipa-tmp
            state:
              external: true
              name: dkrypt_state
          EOF
      - name: Pull and deploy immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: |
          set -e
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker container inspect dkrypt >/dev/null 2>&1; then
            docker tag "$(docker inspect --format '{{.Image}}' dkrypt)" dkrypt:previous
          elif docker image inspect dkrypt:latest >/dev/null 2>&1; then
            docker tag dkrypt:latest dkrypt:previous
          fi
          docker pull "$IMAGE"
          docker tag "$IMAGE" dkrypt:latest
          DKRYPT_IMAGE="$IMAGE" docker compose --env-file /home/adrian/.local/share/dkrypt/.env --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml config >/dev/null
          docker volume inspect dkrypt_state >/dev/null
          docker run --rm --network none --user 10001:10001 --mount type=volume,source=dkrypt_state,target=/data/state,readonly --tmpfs /tmp:rw,nosuid,size=1g,uid=10001,gid=10001 --env STATE_DIR=/data/state --env STATE_DATABASE_FILE=dkrypt.sqlite --entrypoint bun "$IMAGE" src/deploymentPreflight.ts
          docker rm -f dkrypt 2>/dev/null || true
          DKRYPT_IMAGE="$IMAGE" docker compose --env-file /home/adrian/.local/share/dkrypt/.env --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml up -d --no-build

      - name: Wait for health, roll back on failure
        run: |
          set -e
          for i in $(seq 1 90); do
            if docker exec dkrypt bun -e "const r=await fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/v1/health',{headers:{authorization:'Bearer '+process.env.API_KEY}}); const b=await r.json(); if (!r.ok || b.database?.integrity !== 'ok') process.exit(1);"; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done

          echo "service did not become healthy in time" >&2
          docker logs --tail 100 dkrypt || true

          if docker image inspect dkrypt:previous >/dev/null 2>&1; then
            echo "rolling back to the previous image" >&2
            DKRYPT_IMAGE=dkrypt:previous docker compose --env-file /home/adrian/.local/share/dkrypt/.env --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml up -d --no-build
          else
            echo "no previous image to roll back to" >&2
          fi
          exit 1
      - name: Run deployment smoke tests
        run: |
          set -e
          rollback() {
            echo "deployment verification failed; rolling back" >&2
            if docker image inspect dkrypt:previous >/dev/null 2>&1; then
              if ! DKRYPT_IMAGE=dkrypt:previous docker compose --env-file /home/adrian/.local/share/dkrypt/.env --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml up -d --no-build; then
                echo "rollback command failed" >&2
                return 1
              fi
            else
              echo "no previous image to roll back to" >&2
            fi
          }
          fail_deployment() {
            docker logs --tail 100 dkrypt || true
            rollback || echo "rollback did not complete successfully" >&2
            exit 1
          }
          smoke() {
            docker exec -i dkrypt bun - <<'JS'
          const base = `http://127.0.0.1:${process.env.PORT || 8080}`;
          const headers = { authorization: `Bearer ${process.env.API_KEY}` };
          const fetchWithTimeout = (input, init = {}) => fetch(input, { ...init, signal: init.signal ?? AbortSignal.timeout(5_000) });
          const readObject = async response => {
            const value = await response.json().catch(() => ({}));
            return value && typeof value === 'object' ? value : {};
          };
          let health;
          let device;
          let readinessDetail = 'health probe has not completed';
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              const response = await fetchWithTimeout(`${base}/v1/health`, { headers, signal: AbortSignal.timeout(3_000) });
              if (!response.ok) throw new Error(`health probe returned HTTP ${response.status}`);
              health = await readObject(response);
              const capabilities = health.bridge?.capabilities ?? [];
              device = health.device;
              const ready = health.ok && health.database?.integrity === 'ok' && health.serviceReady === true && health.bridge?.state === 'ready' && capabilities.includes('list_devices') && capabilities.includes('cancel') && device?.transport === 'usb' && device.reachable && device.transportState === 'ready' && device.readiness === 'ready' && device.subsystems?.agent === 'ready';
              if (ready) break;
              readinessDetail = JSON.stringify({ health, device });
            } catch (error) {
              readinessDetail = String(error);
            }
            if (attempt === 29) throw new Error(`deployment device readiness did not settle: ${readinessDetail}`);
            await new Promise(resolve => setTimeout(resolve, 2_000));
          }
          const metrics = await (await fetchWithTimeout(`${base}/v1/metrics`, { headers })).text();
          if (!metrics.includes('dkrypt_device_bridge_event_stream_connected{transport="usbmux"} 1')) throw new Error('Rust usbmuxd event stream is not connected');
          const openapi = await (await fetchWithTimeout(`${base}/openapi.json`)).json();
          if (!openapi.paths || Object.keys(openapi.paths).length < 20) throw new Error('OpenAPI route inventory is incomplete');
          const status = await fetchWithTimeout(`${base}/v1/status`);
          const csp = status.headers.get('content-security-policy') ?? '';
          if (!csp.includes('style-src-elem')) throw new Error('content security policy is incomplete');
          const session = await fetchWithTimeout(`${base}/v1/auth/session`);
          if (!session.headers.get('x-ratelimit-limit')) throw new Error('shared API rate limit is not active');
          if ((await session.json()).loggedIn !== false) throw new Error('unauthenticated session endpoint did not report signed-out state');
          const [events, artifacts] = await Promise.all([
            fetchWithTimeout(`${base}/v1/dashboard/events`),
            fetchWithTimeout(`${base}/v1/dashboard/artifacts?limit=1`),
          ]);
          if (events.status !== 401 || artifacts.status !== 401) throw new Error('dashboard event and artifact routes did not enforce session authentication');
          const fs = await import('node:fs/promises');
          const childProcess = await import('node:child_process');
          const path = await import('node:path');
          const crypto = await import('node:crypto');
          const artifactProbePath = path.join(process.env.ARTIFACT_DIR || '/data/artifacts', `.dkrypt-deploy-smoke-${crypto.randomUUID()}`);
          const artifactProbeContent = 'artifact-storage-probe';
          try {
            const storageWrite = childProcess.spawnSync('setpriv', [
              '--reuid=10001',
              '--regid=10001',
              '--clear-groups',
              'bun',
              '-e',
              `await Bun.write(${JSON.stringify(artifactProbePath)}, ${JSON.stringify(artifactProbeContent)}); if (await Bun.file(${JSON.stringify(artifactProbePath)}).text() !== ${JSON.stringify(artifactProbeContent)}) process.exit(1)`,
            ], { encoding: 'utf8' });
            if (storageWrite.status !== 0) throw new Error('artifact storage failed the API-user read/write check');
            if (await fs.readFile(artifactProbePath, 'utf8') !== artifactProbeContent) throw new Error('artifact storage failed its read-after-write check');
          } finally {
            await fs.unlink(artifactProbePath).catch(() => {});
          }
          const { config } = await import('/app/src/config.ts');
          if (config.deviceBridgeSecret.length < 32) {
            const secretFile = process.env.DEVICE_BRIDGE_SECRET_FILE || path.join(process.env.STATE_DIR || '/data/state', 'device-bridge.secret');
            config.deviceBridgeSecret = (await fs.readFile(secretFile, 'utf8')).trim();
          }
          const { getPrimaryDevice } = await import('/app/src/store/state.ts');
          async function verifyAuthenticatedRoutes(cookieHeaders) {
            const authenticatedSession = await fetchWithTimeout(`${base}/v1/auth/session`, { headers: cookieHeaders });
            const sessionPage = await readObject(authenticatedSession);
            if (authenticatedSession.status !== 200 || sessionPage.loggedIn !== true) {
              throw new Error(`authenticated session check failed: HTTP ${authenticatedSession.status}, code=${sessionPage.code ?? 'unknown'}`);
            }
            const authenticatedArtifacts = await fetchWithTimeout(`${base}/v1/dashboard/artifacts?limit=1`, { headers: cookieHeaders });
            const artifactPage = await readObject(authenticatedArtifacts);
            if (authenticatedArtifacts.status !== 200 || !Array.isArray(artifactPage.artifacts) || typeof artifactPage.total !== 'number' || typeof artifactPage.totalBytes !== 'number' || typeof artifactPage.maxBytes !== 'number') {
              throw new Error(JSON.stringify({
                message: 'authenticated artifact listing did not return a valid page',
                status: authenticatedArtifacts.status,
                contentType: authenticatedArtifacts.headers.get('content-type'),
                bodyKeys: Object.keys(artifactPage),
                code: artifactPage.code,
                messageDetail: artifactPage.message,
                expectedFields: {
                  artifacts: Array.isArray(artifactPage.artifacts),
                  total: typeof artifactPage.total,
                  totalBytes: typeof artifactPage.totalBytes,
                  maxBytes: typeof artifactPage.maxBytes,
                },
              }));
            }
            let eventReader;
            const eventController = new AbortController();
            const eventTimeout = setTimeout(() => eventController.abort(), 5_000);
            try {
              const eventStream = await fetchWithTimeout(`${base}/v1/dashboard/events?projectId=default`, { headers: cookieHeaders, signal: eventController.signal });
              if (eventStream.status !== 200 || !eventStream.headers.get('content-type')?.includes('text/event-stream') || !eventStream.body) {
                throw new Error('authenticated dashboard event stream did not open');
              }
              eventReader = eventStream.body.getReader();
              const decoder = new TextDecoder();
              let initialEvents = '';
              while (!initialEvents.includes('event: overview') && initialEvents.length < 262_144) {
                const chunk = await eventReader.read();
                if (chunk.done) break;
                initialEvents += decoder.decode(chunk.value, { stream: true });
              }
              if (!initialEvents.includes('event: overview')) throw new Error('authenticated dashboard event stream did not send its initial overview');
            } finally {
              clearTimeout(eventTimeout);
              await eventReader?.cancel().catch(() => {});
              eventController.abort();
            }
          }
          const login = await fetchWithTimeout(`${base}/v1/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: process.env.ADMIN_PASSWORD }),
          });
          let authenticatedRoutes = false;
          if (login.ok) {
            const cookie = login.headers.get('set-cookie')?.split(';', 1)[0];
            const cookieHeaders = { cookie: cookie ?? '' };
            try {
              if (!cookie?.startsWith('session=')) throw new Error('smoke login succeeded without issuing a session cookie');
              await verifyAuthenticatedRoutes(cookieHeaders);
              authenticatedRoutes = true;
            } finally {
              await fetchWithTimeout(`${base}/v1/auth/logout`, { method: 'POST', headers: cookieHeaders }).catch(() => {});
            }
          } else {
            const loginError = await readObject(login);
            if (loginError.code !== 'mfa_required') throw new Error(`smoke login failed: HTTP ${login.status}, code=${loginError.code ?? 'unknown'}`);
            console.log('authenticated dashboard probes skipped because root MFA is enabled');
          }
          await fs.stat(process.env.DEVICE_BRIDGE_SOCKET || '/run/dkrypt/device-bridge.sock');
          const processIds = (await fs.readdir('/proc')).filter((entry) => /^\d+$/.test(entry));
          const processes = await Promise.all(processIds.map(async (pid) => {
            try {
              const [commandLine, status] = await Promise.all([
                fs.readFile(`/proc/${pid}/cmdline`, 'utf8'),
                fs.readFile(`/proc/${pid}/status`, 'utf8'),
              ]);
              return { commandLine, status };
            } catch {
              return undefined;
            }
          }));
          const apiProcess = processes.find((entry) => entry?.commandLine.includes('src/server.ts'));
          const bridgeProcess = processes.find((entry) => entry?.commandLine.includes('dkrypt-device-bridge'));
          const apiIdentity = apiProcess?.status.match(/^Uid:\s+(\d+)\s+(\d+)/m);
          const bridgeIdentity = bridgeProcess?.status.match(/^Uid:\s+(\d+)\s+(\d+)/m);
          const bridgeGroup = bridgeProcess?.status.match(/^Gid:\s+(\d+)\s+(\d+)/m);
          if (apiIdentity?.[2] !== '10001' || bridgeIdentity?.[2] !== '0' || bridgeGroup?.[2] !== '10001') {
            throw new Error('API and USB bridge do not have the expected separated runtime identities');
          }
          const key = await fs.stat('/run/dkrypt/device_ssh_key');
          if (key.uid !== 0 || key.gid !== 10001 || (key.mode & 0o777) !== 0o440) throw new Error('device SSH key permissions are not restricted to the API group');
          try {
            await fs.stat('/root/.ipadecrypt');
            throw new Error('legacy .ipadecrypt bootstrap path is present');
          } catch (error) {
            if (error instanceof Error && !String(error.message).includes('ENOENT')) throw error;
          }
          const { withAutoinstallDeviceAgent } = await import('/app/src/idevice.ts');
          const primaryDevice = getPrimaryDevice();
          if (!primaryDevice?.udid || primaryDevice.host || primaryDevice.usbmuxNetwork === true) throw new Error('configured primary device is not a direct USB pairing');
          const agentStatus = await withAutoinstallDeviceAgent(primaryDevice, client => client.call('status', {}, 3_000));
          if (typeof agentStatus.agentVersion !== 'string') throw new Error('signed USB device-agent status request was incomplete');
          console.log(JSON.stringify({
            health: health.ok,
            device,
            bridge: health.bridge,
            usbAgent: { version: agentStatus.agentVersion },
            runtime: { apiUid: apiIdentity[2], bridgeUid: bridgeIdentity[2] },
            routes: Object.keys(openapi.paths).length,
            csp: true,
            rateLimit: true,
            authGuards: true,
            authenticatedRoutes,
          }));
          JS
          }
          if ! smoke; then
            echo 'deployment smoke tests failed' >&2
            fail_deployment
          fi
          if ! mounts=$(docker inspect --format '{{json .Mounts}}' dkrypt); then
            echo 'deployment container mount inventory is unavailable' >&2
            fail_deployment
          fi
          if printf '%s' "$mounts" | grep -q '/root/.ipadecrypt'; then
            echo 'legacy .ipadecrypt mount is present' >&2
            fail_deployment
          fi
          if systemctl is-enabled --quiet ssh-over-usb.service 2>/dev/null; then
            echo 'legacy ssh-over-usb service is enabled' >&2
            fail_deployment
          fi
          if systemctl is-active --quiet ssh-over-usb.service 2>/dev/null; then
            echo 'legacy ssh-over-usb service is active' >&2
            fail_deployment
          fi
