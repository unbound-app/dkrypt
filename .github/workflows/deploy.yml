name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: |
          cd packages/dkrypt && bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile
      - name: Run Moon checks
        run: bunx @moonrepo/cli@2.4.6 run dkrypt:check

  image:
    name: Build immutable image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Generate changelog asset
        run: |
          cd packages/dkrypt/web
          bun install --frozen-lockfile
          bun run scripts/generate-changelog.ts
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: packages/dkrypt/Dockerfile
          push: true
          build-args: BUILD_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main

  deploy:
    name: Deploy to homelab
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    steps:
      - name: Migrate runtime configuration
        run: |
          set -e
          RUNTIME_DIR=/home/adrian/.local/share/dkrypt
          LEGACY_DIR=/home/adrian/dkrypt
          install -d -m 700 "$RUNTIME_DIR"
          if [ ! -f "$RUNTIME_DIR/.env" ] && [ -f "$LEGACY_DIR/.env" ]; then
            install -m 600 "$LEGACY_DIR/.env" "$RUNTIME_DIR/.env"
          fi
          test -f "$RUNTIME_DIR/.env"
      - name: Pull and deploy immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: |
          set -e
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker container inspect dkrypt >/dev/null 2>&1; then
            docker tag "$(docker inspect --format '{{.Image}}' dkrypt)" dkrypt:previous
          elif docker image inspect dkrypt:latest >/dev/null 2>&1; then
            docker tag dkrypt:latest dkrypt:previous
          fi
          docker pull "$IMAGE"
          docker tag "$IMAGE" dkrypt:latest
          docker rm -f dkrypt 2>/dev/null || true
          docker run -d \
            --name dkrypt \
            --restart unless-stopped \
            --network host \
            --env-file /home/adrian/.local/share/dkrypt/.env \
            -e PORT=8080 \
            -e BIND_HOST=127.0.0.1 \
            --mount type=volume,src=dkrypt_appstore-config,dst=/root/.ipadecrypt \
            --mount type=volume,src=dkrypt_ipa-tmp,dst=/data/tmp \
            --mount type=volume,src=dkrypt_state,dst=/data/state \
            --mount type=bind,src=/home/adrian/.ssh/id_ed25519_ipad,dst=/root/.ssh/id_ed25519,readonly \
            "$IMAGE"

      - name: Wait for health, roll back on failure
        run: |
          set -e
          for i in $(seq 1 15); do
            page=$(curl -sf http://127.0.0.1:8080/ || true)
            asset=$(printf '%s' "$page" | grep -oE '/assets/[^" ]+\.js' | head -n 1)
            if [ -n "$asset" ] && curl -sf -o /dev/null "http://127.0.0.1:8080$asset"; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done

          echo "service did not become healthy in time" >&2
          docker logs --tail 50 dkrypt || true

          if docker image inspect dkrypt:previous >/dev/null 2>&1; then
            echo "rolling back to the previous image" >&2
            docker rm -f dkrypt 2>/dev/null || true
            docker run -d \
              --name dkrypt \
              --restart unless-stopped \
              --network host \
              --env-file /home/adrian/.local/share/dkrypt/.env \
              -e PORT=8080 \
              -e BIND_HOST=127.0.0.1 \
              --mount type=volume,src=dkrypt_appstore-config,dst=/root/.ipadecrypt \
              --mount type=volume,src=dkrypt_ipa-tmp,dst=/data/tmp \
              --mount type=volume,src=dkrypt_state,dst=/data/state \
              --mount type=bind,src=/home/adrian/.ssh/id_ed25519_ipad,dst=/root/.ssh/id_ed25519,readonly \
              dkrypt:previous
          else
            echo "no previous image to roll back to" >&2
          fi
          exit 1

      - name: Remove legacy checkout
        run: |
          set -e
          LEGACY_DIR=/home/adrian/dkrypt
          if [ -d "$LEGACY_DIR" ] && [ ! -L "$LEGACY_DIR" ]; then
            rm -rf -- "$LEGACY_DIR"
          fi
