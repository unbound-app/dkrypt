name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  ci:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        run: |
          cd packages/dkrypt && bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile
      - name: Run Moon checks
        run: bunx @moonrepo/cli@2.4.6 run dkrypt:check
      - name: Verify generated API clients
        run: |
          cd packages/dkrypt
          bun run clients:generate
          python -m py_compile clients/python/dkrypt_client.py
          git diff --exit-code -- clients
      - name: Validate container supervisor
        run: sh -n packages/dkrypt/entrypoint.sh
      - name: Test Rust device bridge
        run: |
          cd packages/device-bridge
          cargo test --locked
          cargo check --locked
      - name: Install Chromium for browser checks
        run: |
          cd packages/dkrypt/web
          bunx playwright install --with-deps chromium
      - name: Run browser checks
        run: |
          cd packages/dkrypt/web
          bun run e2e

  image:
    name: Build immutable image
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Generate changelog asset
        run: |
          cd packages/dkrypt/web
          bun install --frozen-lockfile
          bun run scripts/generate-changelog.ts
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: packages/dkrypt/Dockerfile
          push: true
          build-args: BUILD_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.20.10
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          output-file: dkrypt-sbom.spdx.json
          format: spdx-json
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dkrypt-sbom-${{ github.sha }}
          path: dkrypt-sbom.spdx.json
          if-no-files-found: error
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
      - name: Sign image and attest SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --predicate dkrypt-sbom.spdx.json --type https://spdx.dev/Document "$IMAGE"

  deploy:
    name: Deploy to homelab
    needs: image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    steps:
      - name: Write runtime stack manifest
        run: |
          set -e
          RUNTIME_DIR=/home/adrian/.local/share/dkrypt
          RUNTIME_HOME=$(cd "$RUNTIME_DIR/../../.." && pwd)
          test -f "$RUNTIME_DIR/.env"
          if docker container inspect dkrypt >/dev/null 2>&1; then
            existing_key_path=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/root/.ssh/id_ed25519"}}{{.Source}}{{end}}{{end}}' dkrypt 2>/dev/null || true)
            if [ -n "$existing_key_path" ]; then
              DEVICE_SSH_KEY_HOST_PATH="$existing_key_path"
            fi
          fi
          if [ -z "${DEVICE_SSH_KEY_HOST_PATH:-}" ]; then
            for candidate in "$RUNTIME_HOME"/.ssh/id_* "$HOME"/.ssh/id_*; do
              case "$candidate" in
                *.pub|*.cert|*.crt) continue ;;
              esac
              if [ -f "$candidate" ] && [ -r "$candidate" ]; then
                DEVICE_SSH_KEY_HOST_PATH="$candidate"
                break
              fi
            done
          fi
          if [ -z "${DEVICE_SSH_KEY_HOST_PATH:-}" ]; then
            echo "No SSH key source configured for the dkrypt compatibility channel" >&2
            echo "Checked $RUNTIME_HOME/.ssh and ${HOME:-unknown}/.ssh" >&2
            find "$RUNTIME_HOME/.ssh" "$HOME/.ssh" -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          printf 'DEVICE_SSH_KEY_HOST_PATH=%s\n' "$DEVICE_SSH_KEY_HOST_PATH" >> "$GITHUB_ENV"
          cat > "$RUNTIME_DIR/compose.yml" <<'EOF'
          name: dkrypt
          services:
            api:
              image: ${DKRYPT_IMAGE:?DKRYPT_IMAGE is required}
              container_name: dkrypt
              restart: unless-stopped
              init: true
              stop_grace_period: 30s
              security_opt:
                - no-new-privileges:true
              network_mode: host
              env_file:
                - .env
              environment:
                PORT: 8080
                BIND_HOST: 127.0.0.1
                SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:?SESSION_SIGNING_SECRET is required}
                DEVICE_BRIDGE_SOCKET: /run/dkrypt/device-bridge.sock
                DEVICE_MUX_SOCKET: /run/dkrypt/usbmuxd.sock
                DEVICE_PAIRING_STORE: /data/state/device-pairing
                NETMUXD_BIN: /usr/local/bin/netmuxd
              volumes:
                - ipa-storage:/data/artifacts
                - state:/data/state
                - ${DEVICE_SSH_KEY_HOST_PATH:?DEVICE_SSH_KEY_HOST_PATH is required}:/root/.ssh/id_ed25519:ro
              devices:
                - /dev/bus/usb:/dev/bus/usb
              tmpfs:
                - /run/dkrypt:mode=0770,size=16m
                - /data/tmp:mode=1770,size=1g
              deploy:
                resources:
                  limits:
                    cpus: '4.0'
                    memory: 4G
          volumes:
            ipa-storage:
              external: true
              name: dkrypt_ipa-tmp
            state:
              external: true
              name: dkrypt_state
          EOF
      - name: Pull and deploy immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: |
          set -e
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker container inspect dkrypt >/dev/null 2>&1; then
            docker tag "$(docker inspect --format '{{.Image}}' dkrypt)" dkrypt:previous
          elif docker image inspect dkrypt:latest >/dev/null 2>&1; then
            docker tag dkrypt:latest dkrypt:previous
          fi
          docker pull "$IMAGE"
          docker tag "$IMAGE" dkrypt:latest
          DKRYPT_IMAGE="$IMAGE" docker compose --env-file /home/adrian/.local/share/dkrypt/.env --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml config >/dev/null
          docker rm -f dkrypt 2>/dev/null || true
          DKRYPT_IMAGE="$IMAGE" docker compose --env-file /home/adrian/.local/share/dkrypt/.env --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml up -d --no-build

      - name: Wait for health, roll back on failure
        run: |
          set -e
          for i in $(seq 1 30); do
            if docker exec dkrypt bun -e "const r=await fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/v1/health',{headers:{authorization:'Bearer '+process.env.API_KEY}}); const b=await r.json(); if (!r.ok || b.database?.integrity !== 'ok') process.exit(1);"; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done

          echo "service did not become healthy in time" >&2
          docker logs --tail 100 dkrypt || true

          if docker image inspect dkrypt:previous >/dev/null 2>&1; then
            echo "rolling back to the previous image" >&2
            DKRYPT_IMAGE=dkrypt:previous docker compose --env-file /home/adrian/.local/share/dkrypt/.env --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml up -d --no-build
          else
            echo "no previous image to roll back to" >&2
          fi
          exit 1
      - name: Run deployment smoke tests
        run: |
          set -e
          rollback() {
            echo "deployment smoke test failed; rolling back" >&2
            if docker image inspect dkrypt:previous >/dev/null 2>&1; then
              DKRYPT_IMAGE=dkrypt:previous docker compose --env-file /home/adrian/.local/share/dkrypt/.env --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml up -d --no-build
            fi
          }
          trap 'rollback' ERR
          smoke() {
            docker exec dkrypt bun -e "const key=process.env.API_KEY; const headers={authorization:'Bearer '+key}; const health=await (await fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/v1/health',{headers})).json(); const capabilities=health.bridge?.capabilities??[]; if (!health.ok || health.database?.integrity !== 'ok' || health.serviceReady !== true || health.bridge?.state !== 'ready' || !capabilities.includes('list_devices') || !capabilities.includes('cancel')) throw new Error(JSON.stringify(health)); if (health.device && (!health.device.reachable || health.device.readiness !== 'ready')) throw new Error('configured device is not ready: '+JSON.stringify(health.device)); const openapi=await (await fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/openapi.json')).json(); if (!openapi.paths || Object.keys(openapi.paths).length < 20) throw new Error('OpenAPI route inventory is incomplete'); const stat=await import('node:fs/promises'); await stat.stat(process.env.DEVICE_BRIDGE_SOCKET||'/run/dkrypt/device-bridge.sock'); try { await stat.stat('/root/.ipadecrypt'); throw new Error('legacy .ipadecrypt bootstrap path is present'); } catch (error) { if (error instanceof Error && !String(error.message).includes('ENOENT')) throw error; } console.log(JSON.stringify({health:health.ok,device:health.device,bridge:health.bridge,paths:Object.keys(openapi.paths).length}));"
          }
          smoke_success=0
          for i in $(seq 1 30); do
            if smoke; then
              smoke_success=1
              break
            fi
            sleep 2
          done
          if [ "$smoke_success" -ne 1 ]; then
            echo 'deployment smoke test did not become ready in time' >&2
            docker logs --tail 100 dkrypt || true
            false
          fi
          if docker inspect --format '{{json .Mounts}}' dkrypt | grep -q '/root/.ipadecrypt'; then
            echo 'legacy .ipadecrypt mount is present' >&2
            false
          fi
          if systemctl is-enabled --quiet ssh-over-usb.service 2>/dev/null; then
            echo 'legacy ssh-over-usb service is enabled' >&2
            false
          fi
          if systemctl is-active --quiet ssh-over-usb.service 2>/dev/null; then
            echo 'legacy ssh-over-usb service is active' >&2
            false
          fi
