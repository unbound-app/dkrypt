name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: |
          cd packages/dkrypt && bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile
      - name: Run Moon checks
        run: bunx @moonrepo/cli@2.4.6 run dkrypt:check

  image:
    name: Build immutable image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Generate changelog asset
        run: |
          cd packages/dkrypt/web
          bun install --frozen-lockfile
          bun run scripts/generate-changelog.ts
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: packages/dkrypt/Dockerfile
          push: true
          build-args: BUILD_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main

  deploy:
    name: Deploy to homelab
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    steps:
      - name: Write runtime stack manifest
        run: |
          set -e
          RUNTIME_DIR=/home/adrian/.local/share/dkrypt
          test -f "$RUNTIME_DIR/.env"
          cat > "$RUNTIME_DIR/compose.yml" <<'EOF'
          name: dkrypt
          services:
            api:
              image: ${DKRYPT_IMAGE:?DKRYPT_IMAGE is required}
              container_name: dkrypt
              restart: unless-stopped
              network_mode: host
              env_file:
                - .env
              environment:
                PORT: 8080
                BIND_HOST: 127.0.0.1
              volumes:
                - appstore-config:/root/.ipadecrypt
                - ipa-tmp:/data/tmp
                - state:/data/state
                - /home/adrian/.ssh/id_ed25519_ipad:/root/.ssh/id_ed25519:ro
          volumes:
            appstore-config:
              external: true
              name: dkrypt_appstore-config
            ipa-tmp:
              external: true
              name: dkrypt_ipa-tmp
            state:
              external: true
              name: dkrypt_state
          EOF
      - name: Pull and deploy immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: |
          set -e
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker container inspect dkrypt >/dev/null 2>&1; then
            docker tag "$(docker inspect --format '{{.Image}}' dkrypt)" dkrypt:previous
          elif docker image inspect dkrypt:latest >/dev/null 2>&1; then
            docker tag dkrypt:latest dkrypt:previous
          fi
          docker pull "$IMAGE"
          docker tag "$IMAGE" dkrypt:latest
          docker rm -f dkrypt 2>/dev/null || true
          DKRYPT_IMAGE="$IMAGE" docker compose --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml up -d --no-build

      - name: Wait for health, roll back on failure
        run: |
          set -e
          for i in $(seq 1 15); do
            page=$(curl -sf http://127.0.0.1:8080/ || true)
            asset=$(printf '%s' "$page" | grep -oE '/assets/[^" ]+\.js' | head -n 1)
            if [ -n "$asset" ] && curl -sf -o /dev/null "http://127.0.0.1:8080$asset"; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done

          echo "service did not become healthy in time" >&2
          docker compose --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml logs --tail 50 api || true

          if docker image inspect dkrypt:previous >/dev/null 2>&1; then
            echo "rolling back to the previous image" >&2
            DKRYPT_IMAGE=dkrypt:previous docker compose --project-name dkrypt -f /home/adrian/.local/share/dkrypt/compose.yml up -d --no-build
          else
            echo "no previous image to roll back to" >&2
          fi
          exit 1
