name: Production shutdown recovery smoke

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type the confirmation token required by the selected operation
        required: false
        type: string
      diagnostic_only:
        description: Read device and container diagnostics without submitting a job or restarting production
        required: false
        default: false
        type: boolean
      existing_job_id:
        description: Optional active decrypt job to continue monitoring without submitting another
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 60
    steps:
      - name: Submit decrypt and verify job recovery across SIGTERM
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          EXISTING_JOB_ID: ${{ inputs.existing_job_id }}
          EXPECTED_BUILD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'dispatch must target main' >&2
            exit 1
          fi
          if [[ "$(docker inspect --format '{{.State.Running}}' dkrypt)" != true ]]; then
            echo 'dkrypt production container is not running' >&2
            exit 1
          fi
          run_dkrypt_bun() {
            local user="$1"
            shift
            docker exec -i --user "$user" "$@" dkrypt sh -c 'secret_file=${DEVICE_BRIDGE_SECRET_FILE:-${STATE_DIR:-/data/state}/device-bridge.secret}; export DEVICE_BRIDGE_SECRET="$(tr -d "\n" < "$secret_file")"; exec bun -'
          }
          if [[ "$DIAGNOSTIC_ONLY" == true ]]; then
            if [[ "$CONFIRMATION" != RUN_DKRYPT_PRODUCTION_DIAGNOSTICS ]]; then
              echo 'read-only diagnostics require the exact diagnostics confirmation' >&2
              exit 1
            fi
            docker inspect --format 'container={{.Name}} running={{.State.Running}} started={{.State.StartedAt}} restarts={{.RestartCount}} exit={{.State.ExitCode}}' dkrypt
            run_dkrypt_bun 10001:10001 <<'JS'
          const headers = { authorization: `Bearer ${process.env.API_KEY}` };
          const base = `http://127.0.0.1:${process.env.PORT || 8080}`;
          const [healthResponse, statusResponse, metricsResponse] = await Promise.all([
            fetch(`${base}/v1/health`, { headers, signal: AbortSignal.timeout(5_000) }),
            fetch(`${base}/v1/status`, { signal: AbortSignal.timeout(5_000) }),
            fetch(`${base}/v1/metrics`, { headers, signal: AbortSignal.timeout(5_000) }),
          ]);
          const health = await healthResponse.json().catch(() => ({}));
          const status = await statusResponse.json().catch(() => ({}));
          const metrics = await metricsResponse.text();
          let bridge;
          try {
            bridge = await (await import('/app/src/idevice.ts')).getRustDeviceBridgeStatus();
          } catch (error) {
            bridge = { error: error instanceof Error ? error.message : String(error) };
          }
          process.stdout.write(`${JSON.stringify({
            healthHttpStatus: healthResponse.status,
            statusHttpStatus: statusResponse.status,
            health: {
              ok: health.ok,
              serviceReady: health.serviceReady,
              database: health.database,
              deployment: health.deployment,
              device: health.device,
            },
            status,
            bridge,
            usbmuxEventStreamConnected: metrics.match(/dkrypt_device_bridge_event_stream_connected\{transport="usbmux"\} [^\n]+/)?.[0],
          })}\n`);
          JS
            docker logs --since 30m --tail 500 dkrypt 2>&1 | grep -Ei 'device bridge|netmuxd|usbmux|device health check|device agent|autoinstall|pairing|usb' | tail -n 160 || true
            exit 0
          fi
          if [[ "$CONFIRMATION" != RUN_DKRYPT_PRODUCTION_SHUTDOWN_RECOVERY ]]; then
            echo 'shutdown recovery requires the exact production restart confirmation' >&2
            exit 1
          fi
          check_health() {
            run_dkrypt_bun 10001:10001 -e EXPECTED_BUILD_REF="$EXPECTED_BUILD_REF" <<'JS'
          const response = await fetch(`http://127.0.0.1:${process.env.PORT || 8080}/v1/health`, {
            headers: { authorization: `Bearer ${process.env.API_KEY}` },
            signal: AbortSignal.timeout(5_000),
          });
          const health = await response.json().catch(() => ({}));
          if (!response.ok || health.database?.integrity !== 'ok' || health.bridge?.state !== 'ready' || health.device?.transportState !== 'ready' || health.device?.subsystems?.agent !== 'ready' || health.deployment?.ref !== process.env.EXPECTED_BUILD_REF) {
            throw new Error(`production deployment is not the requested healthy build: ${JSON.stringify({ ok: health.ok, deployment: health.deployment, device: health.device })}`);
          }
          JS
          }
          check_health
          stopped=0
          session_cookie=''
          restore_and_logout() {
            if [[ "$stopped" == 1 ]]; then
              if [[ "$(docker inspect --format '{{.State.Running}}' dkrypt 2>/dev/null || true)" != true ]]; then
                docker start dkrypt >/dev/null || true
              fi
              if [[ "$(docker inspect --format '{{.State.Running}}' dkrypt 2>/dev/null || true)" == true ]]; then
                stopped=0
                recovery_ready=0
                for attempt in $(seq 1 90); do
                  if check_health >/dev/null 2>&1; then
                    recovery_ready=1
                    break
                  fi
                  sleep 2
                done
                if [[ "$recovery_ready" != 1 ]]; then
                  docker logs --tail 100 dkrypt >&2 || true
                  echo 'production container was restarted by cleanup but did not recover USB-agent readiness' >&2
                fi
              else
                echo 'production container could not be started by cleanup' >&2
              fi
            fi
            if [[ -n "$session_cookie" ]] && [[ "$(docker inspect --format '{{.State.Running}}' dkrypt 2>/dev/null || true)" == true ]]; then
              run_dkrypt_bun 10001:10001 -e TEST_SESSION_COOKIE="$session_cookie" <<'JS' >/dev/null 2>&1 || true
          const { config } = await import('/app/src/config.ts');
          const response = await fetch(`http://127.0.0.1:${process.env.PORT || 8080}/v1/auth/logout`, {
            method: 'POST',
            headers: {
              cookie: process.env.TEST_SESSION_COOKIE,
              origin: new URL(config.publicBaseUrl).origin,
              'sec-fetch-site': 'same-origin',
            },
          });
          if (!response.ok) process.exitCode = 1;
          JS
            fi
          }
          trap restore_and_logout EXIT
          read_job_status_for_id() {
            run_dkrypt_bun 10001:10001 -e TEST_JOB_ID="$1" <<'JS'
          const { Database } = await import('bun:sqlite');
          const database = new Database('/data/state/dkrypt.sqlite', { readonly: true });
          try {
            const row = database.query('SELECT payload FROM jobs WHERE id = ?').get(process.env.TEST_JOB_ID)
              ?? database.query('SELECT payload FROM job_history WHERE id = ?').get(process.env.TEST_JOB_ID);
            if (!row || typeof row.payload !== 'string') {
              process.stdout.write('missing\t0\t\n');
            } else {
              const job = JSON.parse(row.payload);
              process.stdout.write(`${job.status}\t${job.attempt ?? 1}\t${job.bundleId ?? ''}\n`);
            }
          } finally {
            database.close();
          }
          JS
          }
          submission_output=''
          if [[ -n "$EXISTING_JOB_ID" ]]; then
            existing_status="$(read_job_status_for_id "$EXISTING_JOB_ID")"
            IFS=$'\t' read -r existing_state existing_attempt existing_bundle <<< "$existing_status"
            if [[ "$existing_state" == failed ]]; then
              echo "existing production decrypt $EXISTING_JOB_ID already failed before the shutdown test" >&2
              exit 1
            fi
            if [[ "$existing_state" == queued || "$existing_state" == running ]]; then
              submission_output="${EXISTING_JOB_ID}"$'\n\n'"${existing_bundle}"
              echo "Continuing existing production decrypt job $EXISTING_JOB_ID in state $existing_state on attempt $existing_attempt"
            elif [[ "$existing_state" == done ]]; then
              echo "Existing production decrypt $EXISTING_JOB_ID completed before SIGTERM; selecting a fresh uncached candidate"
            else
              echo "existing production decrypt $EXISTING_JOB_ID could not be found in SQLite" >&2
              exit 1
            fi
          fi
          if [[ -z "$submission_output" ]]; then
            submission_output="$(run_dkrypt_bun 10001:10001 <<'JS'
          const { config } = await import('/app/src/config.ts');
          const { setSessionCookie } = await import('/app/src/session.ts');
          const { PermissionFlag } = await import('/app/src/permissions.ts');
          const { getPrimaryDevice } = await import('/app/src/store/state.ts');
          const { findInstalledAppStoreBundle, withSSH } = await import('/app/src/idevice.ts');
          const { lookupCurrentVersion } = await import('/app/src/scheduler/itunes.ts');
          const candidates = [
            'org.videolan.vlc-ios',
            'com.apple.Pages',
            'com.apple.Numbers',
            'com.apple.Keynote',
            'com.apple.iMovie',
            'com.google.ios.youtube',
            'com.spotify.client',
            'com.google.Gmail',
            'com.google.Maps',
            'com.facebook.Facebook',
            'com.amazon.Amazon',
            'com.reddit.Reddit',
            'com.google.Drive',
            'com.microsoft.Office.Word',
          ];
          const device = getPrimaryDevice();
          if (!device?.udid || device.host || device.usbmuxNetwork === true) throw new Error('primary device is not a directly paired USB device');
          const installed = await withSSH(device, async connection => {
            const bundles = new Set();
            for (const bundleId of candidates) {
              const appPath = await findInstalledAppStoreBundle(connection, bundleId);
              if (appPath) bundles.add(bundleId);
            }
            return bundles;
          });
          const eligible = [];
          const skipped = { installed: 0, incompatible: 0, size: 0, unavailable: 0 };
          const minimumSmokeAppSize = 250 * 1024 * 1024;
          const maximumSmokeAppSize = 900 * 1024 * 1024;
          const deviceVersion = device.iosVersion?.split('.').map(Number);
          for (const bundleId of candidates) {
            if (installed.has(bundleId)) {
              skipped.installed += 1;
              continue;
            }
            try {
              const current = await lookupCurrentVersion(bundleId, AbortSignal.timeout(10_000));
              const minimumVersion = current.minimumOsVersion?.split('.').map(Number);
              if (minimumVersion && (!deviceVersion || compareVersions(deviceVersion, minimumVersion) < 0)) {
                skipped.incompatible += 1;
                continue;
              }
              if (current.fileSizeBytes && (current.fileSizeBytes < minimumSmokeAppSize || current.fileSizeBytes > maximumSmokeAppSize)) {
                skipped.size += 1;
                continue;
              }
              eligible.push({ bundleId, fileSizeBytes: current.fileSizeBytes ?? 0 });
            } catch {
              skipped.unavailable += 1;
              continue;
            }
          }
          eligible.sort((left, right) => right.fileSizeBytes - left.fileSizeBytes);
          if (eligible.length === 0) throw new Error(`no safe, compatible, uncached App Store app was available for the production decrypt smoke: ${JSON.stringify(skipped)}`);
          let sessionCookie = '';
          setSessionCookie({ setHeader: (_name, value) => { sessionCookie = value; } }, {
            sub: 'root',
            permissions: PermissionFlag.administrator,
            mfaVerified: true,
          });
          sessionCookie = sessionCookie.split(';', 1)[0];
          const base = `http://127.0.0.1:${process.env.PORT || 8080}`;
          const headers = {
            cookie: sessionCookie,
            origin: new URL(config.publicBaseUrl).origin,
            'sec-fetch-site': 'same-origin',
            'content-type': 'application/json',
          };
          const logoutSession = () => fetch(`${base}/v1/auth/logout`, { method: 'POST', headers, signal: AbortSignal.timeout(5_000) }).catch(() => {});
          let selected;
          try {
            for (const candidate of eligible) {
              const { bundleId } = candidate;
              const submittedAt = Date.now();
              const response = await fetch(`${base}/v1/dashboard/decrypt`, {
                method: 'POST',
                headers,
                body: JSON.stringify({ bundleId, projectId: 'default' }),
                signal: AbortSignal.timeout(10_000),
              });
              const job = await response.json().catch(() => ({}));
              if (response.status !== 202 || !job.id) throw new Error(`public decrypt request failed with HTTP ${response.status}`);
              if (job.status === 'done' || job.status === 'failed' || job.cacheHit === true) continue;
              if (Date.parse(job.createdAt) < submittedAt) continue;
              selected = { jobId: job.id, bundleId };
              break;
            }
          } catch (error) {
            await logoutSession();
            throw error;
          }
          if (!selected) {
            await logoutSession();
            throw new Error('all compatible App Store smoke candidates were cached, active, or completed before the job could be interrupted');
          }
          process.stdout.write(`${selected.jobId}\n${sessionCookie}\n${selected.bundleId}\n`);

          function compareVersions(left, right) {
            const length = Math.max(left.length, right.length);
            for (let index = 0; index < length; index += 1) {
              const difference = (left[index] ?? 0) - (right[index] ?? 0);
              if (difference !== 0) return Math.sign(difference);
            }
            return 0;
          }
          JS
            )"
          fi
          mapfile -t submission_lines <<< "$submission_output"
          if [[ ${#submission_lines[@]} -lt 3 ]]; then
            echo 'decrypt submission did not return a job identity' >&2
            exit 1
          fi
          job_id="${submission_lines[-3]}"
          session_cookie="${submission_lines[-2]}"
          bundle_id="${submission_lines[-1]}"
          if [[ -z "$job_id" || -z "$bundle_id" || ( -z "$session_cookie" && -z "$EXISTING_JOB_ID" ) ]]; then
            echo 'decrypt submission did not return a job identity' >&2
            exit 1
          fi
          if [[ -n "$session_cookie" ]]; then
            echo "::add-mask::$session_cookie"
            echo "Submitted production decrypt job $job_id for $bundle_id"
          fi
          if [[ -z "$session_cookie" ]]; then
            session_cookie="$(run_dkrypt_bun 10001:10001 <<'JS'
          const { setSessionCookie } = await import('/app/src/session.ts');
          const { PermissionFlag } = await import('/app/src/permissions.ts');
          let cookie = '';
          setSessionCookie({ setHeader: (_name, value) => { cookie = value; } }, {
            sub: 'root',
            permissions: PermissionFlag.administrator,
            mfaVerified: true,
          });
          process.stdout.write(cookie.split(';', 1)[0]);
          JS
            )"
            echo "::add-mask::$session_cookie"
          fi
          read_job_status() {
            run_dkrypt_bun 10001:10001 -e TEST_JOB_ID="$job_id" -e TEST_SESSION_COOKIE="$session_cookie" <<'JS'
          const base = `http://127.0.0.1:${process.env.PORT || 8080}`;
          const response = await fetch(`${base}/v1/dashboard/jobs/${encodeURIComponent(process.env.TEST_JOB_ID)}/timeline`, {
            headers: { cookie: process.env.TEST_SESSION_COOKIE },
            signal: AbortSignal.timeout(5_000),
          });
          if (!response.ok) throw new Error(`dashboard job timeline failed with HTTP ${response.status}`);
          const timeline = await response.json();
          const events = Array.isArray(timeline.events) ? timeline.events : [];
          const latestRequeue = events.filter(event => event.label === 'Requeued after graceful shutdown').at(-1);
          process.stdout.write(`${timeline.status}\t${timeline.bundleId ?? ''}\t${latestRequeue?.at ?? 0}\t${events.at(-1)?.label ?? ''}\n`);
          JS
          }
          parse_job_status() {
            IFS=$'\t' read -r job_state observed_bundle recovery_event_at progress_label <<< "$1"
            if [[ "$observed_bundle" != "$bundle_id" ]]; then
              echo "dashboard returned an unexpected job for $job_id: $observed_bundle" >&2
              return 1
            fi
          }
          running=0
          for attempt in $(seq 1 120); do
            status="$(read_job_status)"
            parse_job_status "$status"
            if [[ "$job_state" == running ]]; then
              running=1
              pre_shutdown_recovery_at=$recovery_event_at
              break
            fi
            if [[ "$job_state" == failed || "$job_state" == done ]]; then
              echo "production decrypt reached $job_state before SIGTERM; no restart performed" >&2
              exit 1
            fi
            sleep 5
          done
          if [[ "$running" != 1 ]]; then
            echo 'production decrypt did not start within 10 minutes; no restart performed' >&2
            exit 1
          fi
          echo "Sending SIGTERM to production while job $job_id is running"
          stopped=1
          docker stop --timeout 150 dkrypt
          container_exit="$(docker inspect --format '{{.State.ExitCode}} {{.State.OOMKilled}}' dkrypt)"
          IFS=' ' read -r exit_code oom_killed <<< "$container_exit"
          docker start dkrypt >/dev/null
          ready=0
          for attempt in $(seq 1 90); do
            if check_health; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            docker logs --tail 100 dkrypt
            echo 'dkrypt did not recover healthy USB-agent readiness after SIGTERM' >&2
            exit 1
          fi
          stopped=0
          if [[ "$exit_code" != 0 || "$oom_killed" != false ]]; then
            echo "production container did not exit gracefully: exit=$exit_code oomKilled=$oom_killed" >&2
            exit 1
          fi
          recovered=0
          for attempt in $(seq 1 60); do
            status="$(read_job_status)"
            parse_job_status "$status"
            if [[ "$job_state" == done || ( "$recovery_event_at" -gt "$pre_shutdown_recovery_at" && ( "$job_state" == queued || "$job_state" == running ) ) ]]; then
              echo "Production decrypt survived shutdown in state $job_state; last event: $progress_label"
              recovered=1
              break
            fi
            if [[ "$job_state" == failed ]]; then
              echo "Production decrypt failed before becoming recoverable after restart: $progress_label" >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$recovered" != 1 ]]; then
            echo 'production job did not return to a recoverable state within two minutes of restart' >&2
            exit 1
          fi
