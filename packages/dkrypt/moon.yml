dependsOn:
  - web
  - autoinstall
tasks:
  test:
    command: bun
    args:
      - test
  typecheck:
    command: bun
    args:
      - run
      - typecheck
  check:
    command: 'true'
    deps:
      - '~:test'
      - '~:typecheck'
      - web:typecheck
      - web:build
  composeBuild:
    command: docker
    args:
      - compose
      - build
  autoinstallDeploy:
    command: ../../scripts/autoinstall-release
    args:
      - deploy
